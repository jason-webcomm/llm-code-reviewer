name: LLM AI Code Reviewer
on:
  issue_comment:
    types: [created]
permissions: write-all
jobs:
  review:
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/tool-review')
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
          
      - name: Install dependencies
        shell: bash
        run: |
            pip install -r requirements.txt
          
      - name: Run LLM AI Code Reviewer
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_URL: ${{ secrets.GITEA_URL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          INPUT_EXCLUDE: ${{ secrets.INPUT_EXCLUDE }}
          HUMAN_LANGUAGE: ${{ secrets.HUMAN_LANGUAGE }}

        run: |
          python3.10 -m src.main src/main.py
